name: ci

# Only on PRs. A squash-merge of a green PR has identical content to what was
# just tested, so re-running on main paid for the same checks twice. Bring the
# push trigger back when something actually deploys from main.
on:
  pull_request:

# A push to an open PR supersedes the run already going. Without this, a
# push-fix-push cycle pays for every superseded macOS build — and macOS bills at
# 10x, so those are the expensive ones to leave running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · format · size · secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SwiftFormat (lint mode)
        run: |
          curl -sSL https://github.com/nicklockwood/SwiftFormat/releases/latest/download/swiftformat_linux.zip -o sf.zip
          unzip -o sf.zip && chmod +x swiftformat_linux
          ./swiftformat_linux --lint . --swiftversion 6.0 || exit 1

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict

      - name: PR size check (handbook §13 — 5 files / 400 lines, size-override label to bypass)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels -q '.labels[].name' | grep -qx 'size-override'; then
            echo "size-override label present — skipping (reason must be in the PR body)"; exit 0
          fi
          BASE=origin/${{ github.event.pull_request.base.ref }}
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          # generated + vendored files excluded (handbook §13)
          EXCLUDE=(':!*.xcodeproj*' ':!.claude/skills/*' ':!**/Package.resolved')
          FILES=$(git diff --name-only $BASE...HEAD -- . "${EXCLUDE[@]}" | wc -l)
          LINES=$(git diff --numstat $BASE...HEAD -- . "${EXCLUDE[@]}" | awk '{a+=$1+$2} END {print a+0}')
          echo "files=$FILES lines=$LINES"
          if [ "$FILES" -gt 5 ] || [ "$LINES" -gt 400 ]; then
            echo "::error::PR exceeds handbook limits ($FILES files, $LINES lines). Split it, or add the size-override label with a written reason."
            exit 1
          fi

  # Which parts of the tree changed, computed on a 1x runner so the 10x one only
  # starts when it has something to build.
  scope:
    name: scope
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      swift: ${{ steps.check.outputs.swift }}
      db: ${{ steps.check.outputs.db }}
      functions: ${{ steps.check.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          BASE=origin/${{ github.event.pull_request.base.ref }}
          if git diff --name-only $BASE...HEAD \
             | grep -qE '\.swift$|^project\.yml$|Package\.(swift|resolved)$|\.swiftlint|\.swiftformat'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Swift/project changes — skipping the macOS build (billed at 10x)."
          fi
          if git diff --name-only $BASE...HEAD | grep -qE '^supabase/(migrations|tests|seed)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No schema changes — skipping the database suite."
          fi
          if git diff --name-only $BASE...HEAD | grep -qE '^supabase/functions/|^Makefile$'; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No edge-function changes — skipping the deno suite."
          fi

  build:
    name: build · test (iOS)
    runs-on: macos-26
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.swift == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project Glossed.xcodeproj -scheme Glossed \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Package tests (every package under core/ and features/)
        run: |
          set -e
          for pkg in core/*/Package.swift features/*/Package.swift; do
            # an unmatched glob stays literal in bash, so skip what does not exist
            [ -e "$pkg" ] || continue
            dir=$(dirname "$pkg")
            echo "::group::swift test $dir"
            (cd "$dir" && swift test)
            echo "::endgroup::"
          done

  db:
    name: db · isolation suite
    runs-on: ubuntu-latest
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.db == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Detect supabase project
        id: has_db
        run: |
          if [ -f supabase/config.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.has_db.outputs.present == 'true'
        with:
          version: latest
      - name: Start + migrate + test
        if: steps.has_db.outputs.present == 'true'
        run: |
          supabase db start
          supabase test db

  functions:
    name: functions · deno
    runs-on: ubuntu-latest
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.functions == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Runs the same target a developer runs locally, so CI and `make` cannot
      # drift into disagreeing about what passing means.
      - run: make functions-test
