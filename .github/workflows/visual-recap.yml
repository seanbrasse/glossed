# Visual recap of a PR — MANUAL ONLY as of Aug 28 2026.
#
# It used to run on every PR opened/reopened. Each run is a full Sonnet agent at
# 30 turns billed to a personal Anthropic key, and a busy session opens a dozen
# PRs — plus a close/reopen for every recap that came back a stub (GLO-59). That
# added up faster than the review was worth paying for automatically.
#
# It is not deleted, because it earns its keep when you ask for it: it has caught
# five real bugs, all one family — a name claiming more certainty than the code
# could supply. Run it on the PRs where that matters.
#
#   gh workflow run visual-recap -f pr=123
#
# Or from the Actions tab → visual-recap → Run workflow.
#
# Runs the repo-vendored /visual-recap skill via claude-code-action. In CI the hosted
# Agent-Native-Plan connector is unavailable, so the skill's CI fallback applies:
# the recap is posted as ONE structured PR comment (mermaid architecture/flow diagram,
# file map grouped by layer, schema/API deltas, review-focus notes) instead of a hosted
# plan. Run /visual-recap locally when you want the full interactive version.
#
# Inert until the ANTHROPIC_API_KEY repo secret is set. Removing that secret is
# the belt-and-braces off switch — nothing else uses it.
name: visual-recap

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to recap"
        required: true
        type: string

concurrency:
  group: recap-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  recap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action exchanges an OIDC token before it can run at all.
      id-token: write
    steps:
      - name: Check secret
        id: key
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not set — no automated recap on this PR (GLO-13)"
          fi

      # A silently-green "recap" check reads as "a recap happened". Say so on the
      # PR itself instead, once, so the gap is visible where reviewers look.
      - name: Say the recap is unavailable
        if: steps.key.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          MARKER="<!-- recap-unavailable -->"
          EXISTING=$(gh pr view "$PR" --repo "$REPO" --json comments -q '.comments[].body' || true)
          if printf '%s' "$EXISTING" | grep -qF "$MARKER"; then
            echo "already noted on this PR"
            exit 0
          fi
          {
            printf '%s\n' "$MARKER"
            printf '%s' "> **No automated visual recap on this PR.** The "
            printf '%s' '`ANTHROPIC_API_KEY`'
            printf '%s' " secret is not set, so the recap workflow skipped "
            printf '%s\n' "([GLO-13](https://linear.app/glossed/issue/GLO-13))."
            printf '%s\n' ">"
            printf '%s' "> The author's hand-written **Visual plan** section is the only "
            printf '%s\n' "shape-of-the-change artifact here — hold it to that bar."
          } > /tmp/recap-note.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/recap-note.md

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read .claude/skills/visual-recap/SKILL.md, then produce a visual recap of PR #${{ inputs.pr }}
            (diff vs its base branch). The hosted plan connector is not available here, so use the skill's
            principles to post the recap as a single PR comment via `gh pr comment`: shape-of-the-change
            first (mermaid diagram of affected modules/flows), file map grouped by architecture layer
            (app/features/core/supabase/docs), any schema or API deltas called out explicitly, then 3-5
            review-focus notes ordered by risk (tenancy/RLS first, per the handbook review checklist).
            Do not review line-by-line; do not approve or request changes; one comment only.
            Write the recap to /tmp/recap.md with the Write tool, then post it with
            `gh pr comment ${{ inputs.pr }} --body-file /tmp/recap.md`. Do not experiment with
            stdin piping, and never post a test or placeholder comment — a run that posts a stub
            and exits still reports green, so the stub is worse than no comment at all.
          claude_args: |
            --model claude-sonnet-5
            # Sonnet takes more turns than Opus for the same recap, and 15 cut it
            # off mid-run. More turns on the cheaper model is still well below
            # Opus at 15 — the point of pinning was cost, not turn count.
            --max-turns 30
            --allowedTools "Bash(git:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Read,Write,Grep,Glob"
