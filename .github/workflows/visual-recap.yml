# Automated visual recap on every PR (handbook: the PR body's "visual plan" section).
#
# Runs the repo-vendored /visual-recap skill via claude-code-action. In CI the hosted
# Agent-Native-Plan connector is unavailable, so the skill's CI fallback applies:
# the recap is posted as ONE structured PR comment (mermaid architecture/flow diagram,
# file map grouped by layer, schema/API deltas, review-focus notes) instead of a hosted
# plan. Run /visual-recap locally when you want the full interactive version.
#
# Inert until the ANTHROPIC_API_KEY repo secret is set.
name: visual-recap

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  recap:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check secret
        id: key
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not set — no automated recap on this PR (GLO-13)"
          fi

      # A silently-green "recap" check reads as "a recap happened". Say so on the
      # PR itself instead, once, so the gap is visible where reviewers look.
      - name: Say the recap is unavailable
        if: steps.key.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- recap-unavailable -->"
          if ! gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
               --json comments -q '.comments[].body' | grep -qF "$MARKER"; then
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body \
              "$MARKER
> **No automated visual recap on this PR.** \`ANTHROPIC_API_KEY\` is not set on this repo, so the recap workflow skipped ([GLO-13](https://linear.app/glossed/issue/GLO-13)). The author's hand-written **Visual plan** section is the only shape-of-the-change artifact here — hold it to that bar."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read .claude/skills/visual-recap/SKILL.md, then produce a visual recap of PR #${{ github.event.pull_request.number }}
            (diff vs its base branch). The hosted plan connector is not available here, so use the skill's
            principles to post the recap as a single PR comment via `gh pr comment`: shape-of-the-change
            first (mermaid diagram of affected modules/flows), file map grouped by architecture layer
            (app/features/core/supabase/docs), any schema or API deltas called out explicitly, then 3-5
            review-focus notes ordered by risk (tenancy/RLS first, per the handbook review checklist).
            Do not review line-by-line; do not approve or request changes; one comment only.
          claude_args: |
            --max-turns 15
            --allowedTools "Bash(git:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Read,Grep,Glob"
