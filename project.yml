name: Glossed
options:
  bundleIdPrefix: com.glossed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  DesignSystem:
    path: core/DesignSystem
  DataKit:
    path: core/DataKit
  Tracking:
    path: core/Tracking
  Ranking:
    path: features/Ranking
  AddLadder:
    path: features/AddLadder
  Shelf:
    path: features/Shelf
  ProductPage:
    path: features/ProductPage
  Discover:
    path: features/Discover
  Import:
    path: features/Import
  Privacy:
    path: features/Privacy
  Profile:
    path: features/Profile
  Browse:
    path: features/Browse
  Leaderboard:
    path: features/Leaderboard
targets:
  Glossed:
    type: application
    platform: iOS
    sources: [app/Glossed/Sources]
    dependencies:
      - package: DesignSystem
      - package: DataKit
      - package: Tracking
      - package: Ranking
      - package: AddLadder
      - package: Shelf
      - package: ProductPage
      - package: Import
      - package: Discover
      - package: Privacy
      - package: Profile
      - package: Browse
      - package: Leaderboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glossed.app
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Shown verbatim in the permission prompt, so it says what the camera is
        # for in the user's terms — not "camera access required".
        INFOPLIST_KEY_NSCameraUsageDescription: "to scan a barcode and find the exact shade you're holding"

        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: 1
schemes:
  Glossed:
    build:
      targets:
        Glossed: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
